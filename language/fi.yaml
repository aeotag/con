help:
  main: |
    Käyttö: con [komento] [valinnat]

    Komennot:
      <nimi>                                  Yhdistä tallennettuun laitteeseen
      show [--group <ryhmä> | --all]          Näytä tallennetut yhteydet
      --name <nimi> <user@ip>                 Lisää nopeasti ja yhdistä
      --name <nimi> --group <r> <user@ip>     Lisää ryhmään ja yhdistä
      edit <nimi>                               Muokkaa yhteyttä interaktiivisesti
      --modify --group <vanha> <uusi>         Nimeä ryhmä uudelleen
      --modify --name <vanha> <uusi>          Nimeä yhteys uudelleen
      --modify --move <nimi> <ryhmä>          Siirrä yhteys ryhmään
      --modify --address <nimi> <ip> [opts]   Lisää osoite (--vpn, --type, --network)
      --modify --rm-address <nimi> <ip>       Poista osoite
      --modify --set <nimi> <kenttä> <arvo>   Aseta kenttä (user, protocol, key, port...)
      export <tyyppi> <nimi>                   Vie yhteys/ryhmä/oneshot yksiriviksi
      import <base64-merkkijono>               Tuo jaetusta vientimerkkijonosta
      --del group <ryhmä>                     Poista ryhmä
      --del name <nimi>                        Poista yhteys
      vpn [show|up|down|status]               VPN-hallinta
      ons <nimi> [valinnat]                   Suorita oneshot
      aws [sso|codeartifact] [valinnat]       AWS-toiminnot
      config lang <en|de|fi|auto>             Aseta kieli
      init                                    Alusta/nollaa asetukset
      help / --help / man                     Näytä tämä ohje

    Valinnat:
      --lang <koodi>                          Ohita kieli tälle komennolle

  vpn: |
    Käyttö: con vpn [komento] [valinnat]

    Komennot:
      show                    Näytä kaikki VPN-yhteydet ja niiden tila
      up <nimi>               Aktivoi VPN-yhteys
      down <nimi>             Deaktivoi VPN-yhteys
      down --all              Deaktivoi kaikki VPN-yhteydet
      status                  Näytä aktiiviset VPN-yhteydet

  oneshot: |
    Käyttö: con ons <nimi> [valinnat]

    Suorita tallennettu oneshot-komento etälaitteilla.

    Valinnat:
      --group <ryhmä>         Kohderyhmä
      --vpn <vpn>             Vaadittu VPN
      --cmd <komento>         Ohita komento
      --tail <n>              Näytä viimeiset N riviä
      --search <regex>        Hae lokeista kaavalla
      --parallel              Pakota rinnakkaissuoritus
      --sequential            Pakota peräkkäissuoritus

  aws: |
    Käyttö: con aws [komento] [valinnat]

    Komennot:
      sso login [--profile <nimi>]          AWS SSO -kirjautuminen
      codeartifact login [--repo <nimi>]    CodeArtifact-todennus
      sso show                              Näytä SSO-profiilit
      codeartifact show                     Näytä CodeArtifact-repot
