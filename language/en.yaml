# --- Man / Help ---
help:
  main: |
    Usage: con [command] [options]

    Commands:
      <name>                                  Connect to saved device by name
      show [--group <group> | --all]          Show saved connections
      --name <name> <user@ip>                 Quick-add and connect
      --name <name> --group <g> <user@ip>     Quick-add to group and connect
      edit <name>                              Interactively edit a connection
      --modify --group <old> <new>            Rename a group
      --modify --name <old> <new>             Rename a connection
      --modify --move <name> <group>          Move connection to group
      --modify --address <name> <ip> [opts]   Add address (--vpn, --type, --network)
      --modify --rm-address <name> <ip>       Remove address
      --modify --set <name> <field> <value>   Set field (user, protocol, key, port...)
      export <type> <name>                    Export connection/group/oneshot as one-liner
      import <base64_string>                   Import from a shared export string
      --del group <group>                     Delete a group
      --del name <name>                       Delete a connection
      vpn [show|up|down|status]               VPN management
      ons <name> [options]                    Run a oneshot
      aws [sso|codeartifact] [options]        AWS operations
      config lang <en|de|fi|auto>             Set language
      init                                    Initialize/reset config
      help / --help / man                     Show this help

    Options:
      --lang <code>                           Override language for this command

  vpn: |
    Usage: con vpn [command] [options]

    Commands:
      show                    List all system VPN connections with status
      up <name>               Activate a VPN connection
      down <name>             Deactivate a VPN connection
      down --all              Deactivate all VPN connections
      status                  Show currently active VPN(s)

  oneshot: |
    Usage: con ons <name> [options]

    Run a saved oneshot command on one or more remote devices.

    Options:
      --group <group>         Target group
      --vpn <vpn>             Required VPN
      --cmd <command>         Override command
      --tail <n>              Show last N lines of output
      --search <regex>        Search logs for pattern
      --parallel              Force parallel execution
      --sequential            Force sequential execution

  aws: |
    Usage: con aws [command] [options]

    Commands:
      sso login [--profile <name>]          AWS SSO login
      codeartifact login [--repo <name>]    CodeArtifact authentication
      sso show                              List SSO profiles
      codeartifact show                     List CodeArtifact repos
