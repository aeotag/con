help:
  main: |
    Verwendung: con [Befehl] [Optionen]

    Befehle:
      <name>                                  Verbindung zu gespeichertem Gerät herstellen
      show [--group <Gruppe> | --all]         Gespeicherte Verbindungen anzeigen
      --name <Name> <user@ip>                 Schnell hinzufügen und verbinden
      --name <Name> --group <G> <user@ip>     In Gruppe hinzufügen und verbinden
      edit <Name>                              Verbindung interaktiv bearbeiten
      --modify --group <alt> <neu>            Gruppe umbenennen
      --modify --name <alt> <neu>             Verbindung umbenennen
      --modify --move <Name> <Gruppe>         Verbindung in Gruppe verschieben
      --modify --address <Name> <IP> [Opts]   Adresse hinzufügen (--vpn, --type, --network)
      --modify --rm-address <Name> <IP>       Adresse entfernen
      --modify --set <Name> <Feld> <Wert>     Feld setzen (user, protocol, key, port...)
      export <Typ> <Name>                     Verbindung/Gruppe/Oneshot als Einzeiler exportieren
      import <Base64-String>                   Aus geteiltem Export-String importieren
      --del group <Gruppe>                    Gruppe löschen
      --del name <Name>                       Verbindung löschen
      vpn [show|up|down|status]               VPN-Verwaltung
      ons <Name> [Optionen]                   Oneshot ausführen
      aws [sso|codeartifact] [Optionen]       AWS-Operationen
      config lang <en|de|fi|auto>             Sprache einstellen
      init                                    Konfiguration initialisieren/zurücksetzen
      help / --help / man                     Diese Hilfe anzeigen

    Optionen:
      --lang <Code>                           Sprache für diesen Befehl überschreiben

  vpn: |
    Verwendung: con vpn [Befehl] [Optionen]

    Befehle:
      show                    Alle VPN-Verbindungen mit Status anzeigen
      up <Name>               VPN-Verbindung aktivieren
      down <Name>             VPN-Verbindung deaktivieren
      down --all              Alle VPN-Verbindungen deaktivieren
      status                  Aktive VPN-Verbindung(en) anzeigen

  oneshot: |
    Verwendung: con ons <Name> [Optionen]

    Gespeicherten Oneshot-Befehl auf Geräten ausführen.

    Optionen:
      --group <Gruppe>        Zielgruppe
      --vpn <VPN>             Benötigtes VPN
      --cmd <Befehl>          Befehl überschreiben
      --tail <n>              Letzte N Zeilen der Ausgabe anzeigen
      --search <regex>        Logs nach Muster durchsuchen
      --parallel              Parallele Ausführung erzwingen
      --sequential            Sequenzielle Ausführung erzwingen

  aws: |
    Verwendung: con aws [Befehl] [Optionen]

    Befehle:
      sso login [--profile <Name>]          AWS SSO Anmeldung
      codeartifact login [--repo <Name>]    CodeArtifact Authentifizierung
      sso show                              SSO-Profile anzeigen
      codeartifact show                     CodeArtifact-Repos anzeigen
