# ============================================================================
# con - Example Connection Configuration
# Location: ~/.config/con/connection.yaml
# ============================================================================
# This file is auto-created by `con init`. Edit to add your connections.
#
# Structure:
#   <group_name>:
#     <device_name>:
#       protocol: ssh|telnet|tunnel   # default: ssh
#       user: <username>
#       key: <ssh_key_filename>       # optional, looked up in ~/.ssh/
#       addresses:
#         - ip: <ip_or_hostname>
#           network: local            # reachable without VPN
#         - ip: <ip_or_hostname>
#           vpn: <vpn_friendly_name>  # requires this VPN to be active
#           type: wireguard|openvpn   # VPN type (informational)
#       # Tunnel-specific (protocol: tunnel):
#       instance_id: i-0abc123...
#       tunnel_type: ssm-session|ssm-port-forward|ec2-instance-connect
#       aws_profile: <profile_name>
#       aws_region: <region>
#       port: 23                      # telnet port (default 23)
# ============================================================================

default: {}

